# All hooks use the same locked development environment as CI.
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: ^(text\.txt|text_scrambled\.txt|text_decoded/)
        entry: uv run --locked --extra dev trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: Fix end of files
        exclude: ^(text\.txt|text_scrambled\.txt|text_decoded/)
        entry: uv run --locked --extra dev end-of-file-fixer
        language: system
        types: [text]
      - id: check-yaml
        name: Check YAML
        entry: uv run --locked --extra dev check-yaml
        language: system
        types: [yaml]
      - id: check-added-large-files
        name: Check added large files
        entry: uv run --locked --extra dev check-added-large-files
        language: system
      - id: check-merge-conflict
        name: Check merge conflicts
        entry: uv run --locked --extra dev check-merge-conflict
        language: system
        types: [text]
      - id: check-toml
        name: Check TOML
        entry: uv run --locked --extra dev check-toml
        language: system
        types: [toml]
      - id: debug-statements
        name: Check debug statements
        entry: uv run --locked --extra dev debug-statement-hook
        language: system
        types: [python]
      - id: mixed-line-ending
        name: Fix mixed line endings
        exclude: ^(text\.txt|text_scrambled\.txt|text_decoded/)
        entry: uv run --locked --extra dev mixed-line-ending --fix=lf
        language: system
        types: [text]
      - id: ruff
        name: Ruff lint
        entry: uv run --locked --extra dev ruff check --fix --exit-non-zero-on-fix src tests
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --extra dev ruff format src tests
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --locked --extra dev mypy src tests
        language: system
        pass_filenames: false
        types_or: [python, pyi]
