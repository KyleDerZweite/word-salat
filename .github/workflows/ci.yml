name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Run tests with coverage
        run: |
          uv run --locked --extra dev pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Run Ruff linter
        run: uv run --locked --extra dev ruff check src tests

      - name: Run Ruff formatter check
        run: uv run --locked --extra dev ruff format --check src tests

      - name: Run mypy
        run: uv run --locked --extra dev mypy src tests

      - name: Check hooks
        run: uv run --locked --extra dev pre-commit run --all-files

      - name: Build distributions with locked tools
        run: uv run --locked --extra dev python -m build --no-isolation

      - name: Check distribution metadata
        run: uv run --locked --extra dev twine check dist/*
